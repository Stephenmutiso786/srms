name: elimu-hub
region: nyc
services:
  - name: web
    environment_slug: docker
    dockerfile_path: Dockerfile
    http_port: 80
    # IMPORTANT: basic-xxs (512MB) causes 502 errors. Min recommended: basic-xs (1GB) or standard-1 (2GB)
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 20
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: APP_NAME
        value: Elimu Hub
      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        value: ""
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "srms_makumbusho"
      - key: DB_USER
        value: ""
      - key: DB_PASS
        value: ""
        type: SECRET
      - key: APP_URL
        value: ""
      - key: APP_SECRET
        value: ""
        type: SECRET
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: REDIS_HOST
        value: ""
        scope: RUN_TIME
      - key: REDIS_PORT
        value: "6379"
        scope: RUN_TIME
