<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRMS Mobile</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0b1f17;
      color: #f4fff9;
    }
    .card {
      width: min(92vw, 460px);
      padding: 24px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.5;
    }
    code {
      word-break: break-word;
      color: #a7ffd3;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SRMS Mobile</h1>
    <p>This Android wrapper opens the locally hosted SRMS server.</p>
    <p>If the app does not connect, make sure the phone is on the same Wi‑Fi as the XAMPP computer and the server URL is reachable:</p>
    <p><code>http://10.80.175.66/srms/script/</code></p>
  </div>
</body>
</html>
